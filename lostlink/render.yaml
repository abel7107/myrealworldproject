services:
  - type: web
    name: lostlink
    env: node
    buildCommand: npm install && cd server && npm install && npm run build && cd .. && cd server && npx prisma generate && npx prisma db push
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        value: 258fe2eac296671b335540ef7b0d85fd4290e4fce9103bf24c4d3dde03b3cdb4
      - key: CLIENT_URL
        value: https://lostlink.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: lostlink-db
          property: connectionString
    disk:
      name: uploads
      mountPath: /app/server/uploads
      sizeGB: 1

databases:
  - name: lostlink-db
    databaseName: lostlink
    user: lostlink_user
    plan: free
